name: meg-stage1-tiny-bert-cpu-training

on:
  pull_request:
    paths:
      - "experiments/meg_stage1/**"
      - "docs/rdte/meg-stage1-tiny-cpu.md"
      - ".github/workflows/meg-stage1-tiny-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m compileall -q experiments/meg_stage1
  tiny-torch-cpu-training:
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned CPU-only PyTorch in disposable public runner (no CUDA)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.4.1'
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.44.2'
      - name: Run actual tiny BERT forward/backward and hostile tests
        run: python -m unittest discover -s experiments/meg_stage1 -p 'test_tiny_cpu_bert.py' -v
      - name: Record model-free publisher-independent mechanism receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meg-stage1-tiny"
          python experiments/meg_stage1/tiny_cpu_bert.py \
            | tee "$RUNNER_TEMP/meg-stage1-tiny/receipt.json"
          python - "$RUNNER_TEMP/meg-stage1-tiny/receipt.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="ACTUAL_SYNTHETIC_TORCH_CPU_TRAINING"
          assert x["scientific_meg_reproduction"] is False
          assert x["pretrained_BERT_weights_loaded"] is False
          assert x["original_dataset_loaded"] is False
          assert x["second_step_gradient_norm_diff_abs"]>0
          PY
      - name: Upload synthetic-only numerical receipt, no checkpoint bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meg-stage1-tiny-cpu-gradient-trace
          path: ${{ runner.temp }}/meg-stage1-tiny/receipt.json
          retention-days: 7
          if-no-files-found: error
