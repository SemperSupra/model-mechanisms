name: model-mechanisms-mlx-phi2-wheel

on:
  pull_request:
    paths:
      - "adapters/backends/mlx/meg_phi2/**"
      - "docs/rdte/meg-mlx-build.md"
      - ".github/workflows/meg-mlx-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check synthetic tests and framework modules are valid Python
        run: |
          python3 -m compileall -q adapters/backends/mlx/meg_phi2
  macos-mlx-wheel-build:
    needs: source-contract
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          architecture: arm64
      - name: Install pinned MLX runtime and wheel build toolchain
        run: |
          python -m pip install --disable-pip-version-check \
            "mlx==0.32.4" "numpy==2.1.1" "mlx-lm==0.31.3" \
            "build==1.3.0" "setuptools>=75,<82" wheel
      - name: Build installable MLX bridge wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meg-mlx/dist"
          python -m build --no-isolation --wheel \
            adapters/backends/mlx/meg_phi2 \
            --outdir "$RUNNER_TEMP/meg-mlx/dist"
          python -m pip install --no-deps "$RUNNER_TEMP"/meg-mlx/dist/*.whl
          python -m pip show meg-mlx-bridge
      - name: Validate actual Phi-2 MLP intervention contracts on GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s adapters/backends/mlx/meg_phi2/tests \
            -p 'test_phi2_bridge.py' -v
          python adapters/backends/mlx/meg_phi2/surrogate_gpu.py \
            | tee "$RUNNER_TEMP/meg-mlx/surrogate.json"
      - name: Write wheel and runtime provenance receipt
        shell: bash
        run: |
          python - "$RUNNER_TEMP/meg-mlx" "${{ matrix.runner }}" "${{ github.sha }}" <<'PY'
          import hashlib, importlib.metadata, json, pathlib, platform, subprocess, sys
          out, runner, source_sha = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          wheels = list((out / "dist").glob("*.whl"))
          assert len(wheels) == 1, "Exactly one wheel required"
          wheel = wheels[0]
          surrogate = json.loads((out / "surrogate.json").read_text())
          assert surrogate["status"] == "PASS" and not surrogate["meg_paper_reproduced"]
          report = {
              "schema": "meg-mlx-wheel-build/v1",
              "status": "PASS",
              "claim": "installable_bridge_with_phi2_mlp_contracts_only",
              "runner": runner,
              "source_commit": source_sha,
              "wheel": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "mlx_version": importlib.metadata.version("mlx"),
              "mlx_lm_version": importlib.metadata.version("mlx-lm"),
              "bridge_version": importlib.metadata.version("meg-mlx-bridge"),
              "arch": platform.machine(),
              "macos": platform.mac_ver()[0],
              "ram_bytes": int(subprocess.check_output(["sysctl", "-n", "hw.memsize"], text=True)),
              "gpu_oracle": surrogate["status"],
              "model_loaded": False,
              "authors_meg_pipeline_ported": False,
              "meg_paper_reproduced": False,
          }
          (out / "build-receipt.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Publish wheel and sanitized build receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meg-mlx-wheel-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/meg-mlx/dist/*.whl
            ${{ runner.temp }}/meg-mlx/build-receipt.json
            ${{ runner.temp }}/meg-mlx/surrogate.json
          retention-days: 14
          if-no-files-found: warn
