name: meg-iclr-official-supplement-audit

on:
  pull_request:
    paths:
      - "tools/audit_meg_iclr_supplement.py"
      - "tests/test_meg_iclr_supplement.py"
      - "docs/rdte/meg-iclr-supplement.md"
      - ".github/workflows/meg-iclr-supplement-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-supplement-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test safe metadata-only ZIP inspector with synthetic files
        run: python3 -m unittest discover -s tests -p 'test_meg_iclr_supplement.py' -v
      - name: Download official ICLR supplementary ZIP to ephemeral temp only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meg-iclr"
          curl --fail --location --silent --show-error --max-time 50 --retry 1 \
            --max-filesize 80000000 \
            "https://proceedings.iclr.cc/paper_files/paper/2026/file/7926a9c34166da5a6a681cc0fe6d8a28-Supplemental-Conference.zip" \
            -o "$RUNNER_TEMP/meg-iclr/supplement.zip"
          test "$(wc -c < "$RUNNER_TEMP/meg-iclr/supplement.zip")" -le 80000000
      - name: Hash archive members without extraction or code execution
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_meg_iclr_supplement.py \
            --zip "$RUNNER_TEMP/meg-iclr/supplement.zip" \
            --output "$RUNNER_TEMP/meg-iclr/inventory.json"
      - name: Publish metadata-only report, NEVER the original supplement ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-meg-supplement-metadata
          path: ${{ runner.temp }}/meg-iclr/inventory.json
          retention-days: 7
          if-no-files-found: error
