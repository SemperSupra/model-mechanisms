name: model-mechanisms-contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned, source-only schema dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate typed experiment contracts
        run: python tools/validate_contracts.py
      - name: Verify deterministic replay and research nonclaims
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Produce standalone model-free replay receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-mechanisms"
          python tools/run_replay.py replays/contract-smoke.json \
            --output "$RUNNER_TEMP/model-mechanisms/scientific-fixture.json" \
            --metadata "$RUNNER_TEMP/model-mechanisms/environment-sidecar.json"
          python - "$RUNNER_TEMP/model-mechanisms/scientific-fixture.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["claim"] == "model_free_contract_smoke_only"
          assert not data["scientific_result"] and not data["model_loaded"]
          PY
      - name: Upload bounded public contract receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-mechanisms-contracts
          path: ${{ runner.temp }}/model-mechanisms/*.json
          retention-days: 7
          if-no-files-found: error
